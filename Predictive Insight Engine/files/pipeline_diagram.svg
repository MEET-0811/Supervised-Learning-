<svg viewBox="0 0 1520 230" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#9CA3AF" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1520" height="230" fill="#0D1117" rx="14"/>

  <!-- Stage 1: Data Collection -->
  <rect x="20" y="45" width="170" height="140" rx="14" fill="#312E81" stroke="#4F46E5" stroke-width="2"/>
  <text x="105" y="90" font-size="34" text-anchor="middle">📥</text>
  <text x="105" y="122" font-size="14" font-weight="bold" fill="#E0E7FF" text-anchor="middle">Data</text>
  <text x="105" y="140" font-size="14" font-weight="bold" fill="#E0E7FF" text-anchor="middle">Collection</text>
  <text x="105" y="165" font-size="10" fill="#A5B4FC" text-anchor="middle">Load raw dataset</text>

  <line x1="190" y1="115" x2="222" y2="115" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Stage 2: Data Cleaning -->
  <rect x="230" y="45" width="170" height="140" rx="14" fill="#3730A3" stroke="#6366F1" stroke-width="2"/>
  <text x="315" y="90" font-size="34" text-anchor="middle">🧹</text>
  <text x="315" y="122" font-size="14" font-weight="bold" fill="#E0E7FF" text-anchor="middle">Data</text>
  <text x="315" y="140" font-size="14" font-weight="bold" fill="#E0E7FF" text-anchor="middle">Cleaning</text>
  <text x="315" y="165" font-size="10" fill="#C7D2FE" text-anchor="middle">Handle nulls / outliers</text>

  <line x1="400" y1="115" x2="432" y2="115" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Stage 3: Data Transformation -->
  <rect x="440" y="45" width="170" height="140" rx="14" fill="#581C87" stroke="#8B5CF6" stroke-width="2"/>
  <text x="525" y="90" font-size="34" text-anchor="middle">🔄</text>
  <text x="525" y="122" font-size="14" font-weight="bold" fill="#EDE9FE" text-anchor="middle">Data</text>
  <text x="525" y="140" font-size="14" font-weight="bold" fill="#EDE9FE" text-anchor="middle">Transformation</text>
  <text x="525" y="165" font-size="10" fill="#DDD6FE" text-anchor="middle">Feature prep / split</text>

