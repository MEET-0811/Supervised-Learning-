  <text x="735" y="122" font-size="14" font-weight="bold" fill="#FAE8FF" text-anchor="middle">EDA /</text>
  <text x="735" y="140" font-size="14" font-weight="bold" fill="#FAE8FF" text-anchor="middle">Analysis</text>
  <text x="735" y="165" font-size="10" fill="#F0ABFC" text-anchor="middle">Explore relationships</text>

